# System-wide ALSA configuration for the radio.
#
# Signal path:
#
#   stereo source
#       |
#       v
#   radio_mono
#       stereo -> mono average
#       0.5L + 0.5R
#       |
#       v
#   radio_left
#       mono -> HiFiBerry physical LEFT only
#       |
#       v
#   MiniAmp LEFT +/- -> single speaker
#
# The MiniAmp RIGHT output is intentionally unused.

pcm.hifiberry_hw {
    type hw
    card sndrpihifiberry
    device 0
}

# Stage 2:
# Accept one mono client channel and place it only on
# physical output channel 0 (LEFT).
pcm.radio_left {
    type route

    slave {
        pcm "hifiberry_hw"
        channels 2
    }

    ttable {
        0.0 1.0
    }
}

# Stage 1:
# Convert whatever the application supplies to one mono channel.
#
# For stereo playback, "average" produces:
#
#     mono = 0.5 * left + 0.5 * right
#
pcm.radio_mono {
    type plug

    slave {
        pcm "radio_left"
        channels 1
    }

    route_policy average
}

pcm.!default {
    type plug
    slave.pcm "radio_mono"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}