music_directory     "/home/pi/audio"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"

bind_to_address     "localhost"
port                "6600"

auto_update         "yes"
restore_paused      "yes"

input {
    plugin "curl"
}

audio_output {
    type        "alsa"
    name        "Radio HiFiBerry"
    device      "radio_mono"
    mixer_type  "software"
}
