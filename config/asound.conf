# System-wide ALSA configuration for the radio.
#
# HiFiBerry MiniAmp is a stereo I2S device, but this radio has one speaker
# connected to the LEFT amplifier output only.
#
# Mix:
#   output-left = 0.5 * input-left + 0.5 * input-right
#
# Nothing is routed to the right amplifier output.

pcm.hifiberry_hw {
    type hw
    card sndrpihifiberry
    device 0
}

pcm.radio_mono {
    type route
    slave.pcm "hifiberry_hw"
    slave.channels 2

    # Input left -> output left at 50%
    ttable.0.0 0.5

    # Input right -> output left at 50%
    ttable.1.0 0.5
}

pcm.!default {
    type plug
    slave.pcm "radio_mono"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}